name: Suggest a change
description: Something dejavu should do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What should dejavu do?
      description: What you or your AI agent tried, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you need it?
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Does it fit dejavu?
      description: See [CONTRIBUTING.md](https://github.com/sgnd/dejavu/blob/main/CONTRIBUTING.md).
      options:
        - label: It helps hand a system built with ansibro over to a client (the BAST, the documentation, the laptop guides or the credentials file)
          required: true
        - label: It needs no secret value in a document
          required: true
