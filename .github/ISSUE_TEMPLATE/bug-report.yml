name: Bug report
description: dejavu did not install, remove or find something
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The dejavu command, and its output. An AI agent can paste this for you.
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `dejavu doctor`
      description: It shows your system, package manager and mise version. No passwords or tokens are in it.
      render: text
    validations:
      required: true
