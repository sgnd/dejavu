# Tests that run on GitHub after every push to main, every pull request,
# and every Monday (mise and the package managers change without us).
name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC
  workflow_dispatch: # adds a "Run workflow" button on GitHub
  workflow_call: # release.yml runs these tests before every release

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }} # mise downloads from GitHub (more downloads per hour with a token)

jobs:
  # 1. The shell scripts have no common bugs, and run in a strict POSIX shell.
  #    Then the quick tests (seconds, nothing installed), in that strict shell too.
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -s sh dejavu tests/test.sh tests/unit.sh
      - run: sudo apt-get install -y dash && dash -n dejavu
      - run: dash tests/unit.sh && bash tests/unit.sh

  # 2. Every Linux package manager, in a fresh container, on Intel/AMD and ARM.
  linux:
    name: ${{ matrix.image }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        image: [debian:13-slim, ubuntu:24.04, fedora:43, rockylinux:9, alpine:3.22, opensuse/tumbleweed]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - image: archlinux:latest # Arch has no ARM image
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -e GITHUB_TOKEN -v "$PWD:/src:ro" ${{ matrix.image }} sh /src/tests/test.sh

  # 3. macOS: GitHub's Macs are throwaway, so the test runs on the Mac itself.
  macos:
    name: macOS
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sh tests/unit.sh # macOS's sh is bash 3.2
      - run: sh tests/test.sh
