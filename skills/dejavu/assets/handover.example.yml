# dejavu: the answers that ansibro cannot know. The agent fills this in with you.
# dejavu: jawaban yang tidak diketahui ansibro. Agent mengisinya bersama Anda.
#
# Never write a password here. / Jangan pernah menulis kata sandi di sini.
# Unknown answers stay empty (null): the documents then say "not provided", never a guess.
# Jawaban yang belum diketahui biarkan kosong (null): dokumen menulis "belum diisi", bukan tebakan.

# Language of the documents: id, en, or [id, en] (two full sets; the Indonesian one prevails).
# Bahasa dokumen: id, en, atau [id, en] (dua set lengkap; versi Bahasa Indonesia yang berlaku).
lang: id

# Short name of the system for the documents, e.g. Production, Staging.
# Nama singkat sistem untuk dokumen, misalnya Produksi, Staging.
environment: null

# Short name used in file names (default: the client's short name). / Nama pendek di nama file.
slug: null

document:
  number: null          # e.g. 001/DOK/VENDOR/XI/2026
  version: "1.0"        # raise it for every re-issue / naikkan setiap terbit ulang
  classification: null  # default: TERBATAS (id) / CONFIDENTIAL (en)
  prepared_by: null     # name / nama
  reviewed_by: null
  approved_by: null
  revisions: []         # [{version: "1.0", date: 2026-11-04, by: Name, change: First issue}]

bast:
  number: null          # e.g. 001/BAST/VENDOR/XI/2026
  date: null            # 2026-11-04
  place: null           # e.g. Jakarta
  title: null           # default: BERITA ACARA SERAH TERIMA PEKERJAAN / HANDOVER AND ACCEPTANCE CERTIFICATE
  stage: single         # single, pho (provisional: work done, warranty starts), fho (final)
  fho_date: null        # with pho: the planned final handover / rencana serah terima akhir
  contract:             # the basis: contract, SPK or PO / dasar: kontrak, SPK, atau PO
    name: null
    number: null
    date: null
  first_party: vendor   # who is PIHAK PERTAMA: vendor (the one handing over) or client
  meterai:
    enabled: false      # a Rp10.000 stamp box / kotak meterai Rp10.000
    side: client        # client or vendor
  copies: 2             # printed copies with equal legal force / rangkap
  mengetahui: []        # [{name: , title: , company: }] (acknowledged by / mengetahui)
  witnesses: []         # [{name: , title: , company: }]

client:
  name: null            # PT Contoh Klien
  short: null           # Contoh (used in file names)
  address: null
  logo: null            # path to a PNG or SVG / path ke file PNG atau SVG
  signer: {name: null, title: null}

vendor:
  name: null            # the company that built the system / perusahaan yang membangun sistem
  short: null
  address: null
  logo: null
  phone: null
  email: null
  website: null
  signer: {name: null, title: null}

# Per server: the public IP when the `host` in config.yml is private, and where it runs.
# Per server: IP publik bila `host` di config.yml adalah IP privat, dan di mana server berjalan.
servers:
  # SERVERS

provider: null          # e.g. DigitalOcean, AWS, on-premises / di gedung sendiri

dns:
  mode: public          # public (normal DNS), internal (company DNS), hosts (no DNS: a hosts file)
  provider: null        # e.g. Cloudflare
  owner: null           # who controls the domain / siapa pemegang domain
  proxied: false        # a CDN in front (Cloudflare orange cloud) / ada CDN di depan

# The client's staff who need access. persona: viewer (web pages), operator (also SSH),
# successor (will run ansibro). os: windows, macos, linux. allow_from: their public IP or office range.
# Staf klien yang butuh akses. persona: viewer (halaman web), operator (juga SSH), successor (akan
# menjalankan ansibro). os: windows, macos, linux. allow_from: IP publik atau rentang IP kantor mereka.
people: []              # [{name: Budi, persona: operator, os: windows, allow_from: [198.51.100.7]}]

# client_key: the client sends their own SSH public key (safest).
# generated: dejavu makes a key for a client who cannot; it goes into the credentials file.
ssh_handover: client_key

# Who keeps ansibro's state/ (to change the system later): vendor, or client.
# The client always gets a copy in the credentials file, so they can change vendor at any time.
state_owner: vendor

password_change_days: 7   # the client changes every password within this many days
vendor_access_end: null   # the date the vendor's SSH key and IPs are removed

delivery:
  kdbx_channel: null       # how the credentials file travels, e.g. USB in person / USB langsung
  passphrase_channel: null # a DIFFERENT channel, e.g. phone call / telepon
  recipient: null          # who receives the passphrase / penerima kata sandi pembuka

support:
  contacts: []           # [{name: , role: , phone: , email: }]
  hours: null            # e.g. Mon-Fri 09:00-17:00 WIB
  sla: null              # e.g. response within 4 hours
  warranty:
    months: null         # e.g. 3
    until: null          # 2027-02-04
    scope: null          # what the warranty covers / cakupan garansi

restore_drill: null      # the date a restore was last tested, or null (never)

tls:
  client_ca: null        # a private CA certificate the laptops must trust (path)

font: null               # {name: Inter, dir: /path/to/fonts} for another font in the PDFs

# Free text, in the language of the documents. Plain words, no passwords.
# Teks bebas, dalam bahasa dokumen. Kata-kata sederhana, tanpa kata sandi.
summary_note: null
known_issues: []         # accepted warnings and open items / temuan yang diterima dan sisa pekerjaan
out_of_scope: []         # what was not part of the work / yang bukan bagian pekerjaan
extra_apps: []           # the client's own apps: [{name: , about: , url: }]
notes: []                # extra notes for the BAST
attach: []               # extra files for the credentials file (paths), e.g. a VPN profile
