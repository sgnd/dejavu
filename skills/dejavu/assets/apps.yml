# Group titles in the credentials file, in order.
groups:
  web: {id: 01 Login web, en: 01 Web logins}
  data: {id: 02 Database dan cache, en: 02 Databases and cache}
  storage: {id: 03 Penyimpanan S3, en: 03 S3 storage}
  infra: {id: 04 Infrastruktur, en: 04 Infrastructure}
  recovery: {id: 05 Pemulihan (darurat), en: 05 Recovery (break-glass)}
  internal: {id: 06 Internal (menjalankan ulang ansibro), en: 06 Internal (re-run ansibro)}
  old: {id: 07 Lama (aplikasi yang sudah dihapus), en: 07 Old (removed apps)}
